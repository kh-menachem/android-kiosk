plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mk.kioskdemo'
    compileSdk 34

    defaultConfig {
        applicationId "com.mk.kioskdemo"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            // signed with the debug key so `assembleRelease` is installable
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint { checkReleaseBuilds false }
}

dependencies {
    implementation project(':kiosk')
}
